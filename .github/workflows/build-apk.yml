name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['box/**', '.github/workflows/box.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk HealthPayDemo.apk
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk HealthPayDemo-Lite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HealthPayDemo-apk
          path: HealthPayDemo*.apk
      # Also keep the latest APK on the "apk" branch, so it can be downloaded from the repo's files.
      - name: Publish to the apk branch
        run: |
          mkdir publish && cp HealthPayDemo*.apk publish/
          cd publish
          printf "Latest build: run %s, commit %s\n" "${{ github.run_number }}" "${GITHUB_SHA::7}" > BUILD.txt
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "APK from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
