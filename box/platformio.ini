; HealthPay counter box (demo). Four builds for the boards sold as
; "ESP32 2.8 inch touch display" in Egypt, each as a shop and a restaurant version. See README.md for which to use.
[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DSMOOTH_FONT=1
  -DARDUINOJSON_USE_LONG_LONG=1
  -DCORE_DEBUG_LEVEL=0

; ESP32-2432S028R "Cheap Yellow Display": ILI9341, touch on its own pins
[env:cyd]
build_flags = ${env.build_flags} -DILI9341_2_DRIVER=1 -DBOX_TOUCH_OWN_BUS=1 -DBOX_BOARD=\"2432S028R\"

; Same board with an ST7789 screen (some USB-C versions)
[env:cyd_st7789]
build_flags = ${env.build_flags} -DST7789_DRIVER=1 -DBOX_TOUCH_OWN_BUS=1 -DBOX_BOARD=\"2432S028-7789\"

; 2.8" ESP32-32E (E32R28T): touch shares the screen's bus, speaker amplifier on IO4
[env:e32]
build_flags = ${env.build_flags} -DILI9341_2_DRIVER=1 -DTOUCH_CS=33 -DBOX_AUDIO_EN=4 -DBOX_BOARD=\"E32R28T\"

[env:e32_st7789]
build_flags = ${env.build_flags} -DST7789_DRIVER=1 -DTOUCH_CS=33 -DBOX_AUDIO_EN=4 -DBOX_BOARD=\"E32R28T-7789\"

; Restaurant versions: the same boards, with "Served by" and a tip screen
; before the QR (only when the server says the shop is a restaurant).
[env:cyd_rest]
build_flags = ${env:cyd.build_flags} -DBOX_RESTAURANT=1

[env:cyd_st7789_rest]
build_flags = ${env:cyd_st7789.build_flags} -DBOX_RESTAURANT=1

[env:e32_rest]
build_flags = ${env:e32.build_flags} -DBOX_RESTAURANT=1

[env:e32_st7789_rest]
build_flags = ${env:e32_st7789.build_flags} -DBOX_RESTAURANT=1
