plugins {
    id 'com.android.application'
}

android {
    namespace 'eg.healthpay.demo'
    compileSdk 34

    defaultConfig {
        applicationId 'eg.healthpay.demo'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    buildFeatures { buildConfig true }

    // "full" has the SMS listener. "lite" has no SMS permission at all, for phones whose
    // Play Protect blocks apps that read SMS: cashier, owner and soundbox screens only.
    flavorDimensions 'kind'
    productFlavors {
        full { dimension 'kind'; buildConfigField 'boolean', 'LISTENER', 'true' }
        lite { dimension 'kind'; applicationIdSuffix '.lite'; versionNameSuffix '-lite'; buildConfigField 'boolean', 'LISTENER', 'false' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
